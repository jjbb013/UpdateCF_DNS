name: Rebuild 2 Nodes (temp)
on:
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
    - name: Rebuild both Vultr nodes and update DNS
      run: |
        set -e
        VK="${{ secrets.VULTR_API_KEY }}"
        CF="${{ secrets.CF_API_TOKEN }}"
        ZONE="1fa9774064820f53fe1733e37a19f721"

        rebuild_node() {
          local OLD_ID="$1" LABEL="$2" REGION="$3" DOMAIN="$4" PORTS="$5"
          echo "########## $LABEL ($OLD_ID) -> $DOMAIN ##########"

          # 0) current plan of old instance
          PLAN=$(curl -s -H "Authorization: Bearer $VK" "https://api.vultr.com/v2/instances/$OLD_ID" | jq -r '.instance.plan')
          echo "plan=$PLAN"

          # 1) snapshot
          SNAP=$(curl -s -X POST "https://api.vultr.com/v2/snapshots" -H "Authorization: Bearer $VK" -H "Content-Type: application/json" \
            --data-raw "{\"instance_id\":\"$OLD_ID\",\"description\":\"gh-actions-rebuild-$(date +%s)\"}" | jq -r '.snapshot.id')
          [ -z "$SNAP" ] || [ "$SNAP" == "null" ] && { echo "snapshot create failed"; return 1; }
          echo "snapshot=$SNAP"
          for i in $(seq 1 90); do
            ST=$(curl -s -H "Authorization: Bearer $VK" "https://api.vultr.com/v2/snapshots/$SNAP" | jq -r '.snapshot.status')
            [ "$ST" == "complete" ] && break
            sleep 20
          done
          [ "$ST" == "complete" ] || { echo "snapshot timeout"; return 1; }

          # 2) new instance from snapshot
          NEW=$(curl -s -X POST "https://api.vultr.com/v2/instances" -H "Authorization: Bearer $VK" -H "Content-Type: application/json" \
            --data-raw "{\"region\":\"$REGION\",\"plan\":\"$PLAN\",\"snapshot_id\":\"$SNAP\",\"label\":\"$LABEL\"}" | jq -r '.instance.id')
          [ -z "$NEW" ] || [ "$NEW" == "null" ] && { echo "create instance failed"; return 1; }
          echo "new_instance=$NEW"

          # 3) wait ready + ip
          NIP=""
          for i in $(seq 1 60); do
            INST=$(curl -s -H "Authorization: Bearer $VK" "https://api.vultr.com/v2/instances/$NEW")
            NIP=$(echo "$INST" | jq -r '.instance.main_ip')
            SS=$(echo "$INST" | jq -r '.instance.server_status')
            if [ "$NIP" != "0.0.0.0" ] && [ "$NIP" != "null" ] && [ -n "$NIP" ] && [ "$SS" == "ok" ]; then break; fi
            sleep 15
          done
          [ -z "$NIP" ] || [ "$NIP" == "0.0.0.0" ] && { echo "no ip"; return 1; }
          echo "new_ip=$NIP"

          # 4) verify service ports from runner (XrayR may need a few minutes)
          OKALL=0
          for attempt in $(seq 1 15); do
            FAIL=0
            for p in $PORTS; do
              timeout 5 bash -c "echo > /dev/tcp/$NIP/$p" 2>/dev/null || { FAIL=1; echo "port $p not ready (attempt $attempt)"; break; }
            done
            [ "$FAIL" -eq 0 ] && { OKALL=1; break; }
            sleep 20
          done
          [ "$OKALL" -eq 1 ] || { echo "ports never came up; keeping old instance, cleaning new"; curl -s -o /dev/null -X DELETE "https://api.vultr.com/v2/instances/$NEW" -H "Authorization: Bearer $VK"; curl -s -o /dev/null -X DELETE "https://api.vultr.com/v2/snapshots/$SNAP" -H "Authorization: Bearer $VK"; return 1; }
          echo "all ports OK"

          # 5) update DNS
          RID=$(curl -s -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?type=A&name=$DOMAIN" | jq -r '.result[0].id')
          [ -z "$RID" ] || [ "$RID" == "null" ] && { echo "no dns record"; return 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records/$RID" \
            -H "Authorization: Bearer $CF" -H "Content-Type: application/json" \
            --data-raw "{\"type\":\"A\",\"name\":\"$DOMAIN\",\"content\":\"$NIP\",\"proxied\":false}")
          [ "$CODE" == "200" ] || { echo "dns update failed http=$CODE"; return 1; }
          echo "dns updated: $DOMAIN -> $NIP"

          # 6) destroy old + snapshot (only after dns switched)
          curl -s -o /dev/null -w "delete old instance -> %{http_code}\n" -X DELETE "https://api.vultr.com/v2/instances/$OLD_ID" -H "Authorization: Bearer $VK"
          curl -s -o /dev/null -w "delete snapshot -> %{http_code}\n" -X DELETE "https://api.vultr.com/v2/snapshots/$SNAP" -H "Authorization: Bearer $VK"
          echo "########## $LABEL DONE: $DOMAIN = $NIP ##########"
        }

        rebuild_node "0ef2023d-9b84-4324-9ee3-228b6fcb85f4" "aws-india01" "sgp" "aws.ap-south1.onemorething.pp.ua" "1081 22"
        rebuild_node "e36b4735-5e52-44ee-ba4f-d03ca68d6669" "13nodes" "sea" "kkk.onemorething.pp.ua" "30071 30072 30083 22"
        echo "=== ALL DONE ==="
