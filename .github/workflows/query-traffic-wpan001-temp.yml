name: Query Monthly Traffic (temp)
on:
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_AP_SOUTH_1 }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_AP_SOUTH_1 }}
        aws-region: ap-south-1

    - name: Query EC2 network traffic month-to-date
      run: |
        set -e
        echo "=== IDENTITY ==="
        aws sts get-caller-identity
        START=$(date -u -d "$(date -u +%Y-%m-01)" +%Y-%m-%dT%H:%M:%SZ)
        END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "=== PERIOD: $START -> $END ==="
        for REGION in $(aws ec2 describe-regions --query 'Regions[*].RegionName' --output text); do
          IDS=$(aws ec2 describe-instances --region $REGION --query 'Reservations[*].Instances[*].InstanceId' --output text || true)
          [ -z "$IDS" ] && continue
          echo "REGION=$REGION instances=$IDS"
          for IID in $IDS; do
            for METRIC in NetworkIn NetworkOut; do
              VAL=$(aws cloudwatch get-metric-statistics --region $REGION --namespace AWS/EC2 --metric-name $METRIC --dimensions Name=InstanceId,Value=$IID --start-time $START --end-time $END --period 86400 --statistics Sum --query 'sum(Datapoints[].Sum)' --output text)
              GB=$(python3 -c "print(round(${VAL:-0}/1024**3,2))" 2>/dev/null || echo "n/a")
              echo "  $IID $METRIC bytes=$VAL (~${GB} GiB)"
            done
          done
        done
        echo "=== COST EXPLORER (best effort) ==="
        aws ce get-cost-and-usage --time-period Start=${START:0:10},End=$(date -u -d tomorrow +%Y-%m-%d) --granularity MONTHLY --metrics NetUnblendedCost --group-by Type=DIMENSION,Key=SERVICE --query 'ResultsByTime[0].Groups[?contains(Keys[0],`Data Transfer`)].[Keys[0],Metrics.NetUnblendedCost.Amount]' --output text 2>/dev/null || echo "Cost Explorer not available"
        echo "=== LIGHTSAIL (best effort) ==="
        for REGION in $(aws ec2 describe-regions --query 'Regions[*].RegionName' --output text); do
          aws lightsail get-instances --region $REGION --query 'instances[*].[name,state.name,publicIpAddress]' --output text 2>/dev/null | sed "s/^/  $REGION /" || true
        done
        echo "=== DONE ==="
