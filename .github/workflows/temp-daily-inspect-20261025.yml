name: temp-daily-inspect-20261025
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
    - name: AWS ap-south-1 (AP_SOUTH_1)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_AP_SOUTH_1 }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_AP_SOUTH_1 }}
        AWS_REGION: ap-south-1
      run: |
        echo "--- AP_SOUTH_1 ap-south-1 instances ---"
        aws ec2 describe-instances --filters Name=instance-state-name,Values=pending,running,stopping,stopped --output json || true
    - name: AWS ap-southeast-1 (SOUTHEAST1)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_SOUTHEAST1 }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_SOUTHEAST1 }}
        AWS_REGION: ap-southeast-1
      run: |
        echo "--- SOUTHEAST1 ap-southeast-1 instances ---"
        aws ec2 describe-instances --filters Name=instance-state-name,Values=pending,running,stopping,stopped --output json || true
        echo "--- MTD NetworkOut i-0dff0d04dc8207c29 ---"
        START=$(date -u -d "$(date +%Y-%m-01)" +%Y-%m-%dT00:00:00Z)
        END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name NetworkOut --dimensions Name=InstanceId,Value=i-0dff0d04dc8207c29 --start-time $START --end-time $END --period 86400 --statistics Sum --output json || true
    - name: DigitalOcean droplets
      env:
        DO_TOKEN: ${{ secrets.DO_API_TOKEN }}
      run: |
        echo "--- DO droplets ---"
        curl -s -m 15 -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/droplets || echo DO_QUERY_FAILED
        echo
        echo "--- DO account ---"
        curl -s -m 15 -H "Authorization: Bearer $DO_TOKEN" https://api.digitalocean.com/v2/account || true
