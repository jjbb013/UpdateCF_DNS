name: Diagnose SEA Node 2 (temp)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
    - name: overseas ICMP vs China ICMP vs apihz TCP variants
      run: |
        echo "--- overseas ping 149.28.11.196 (5 pkts) ---"
        ping -c 5 -W 3 149.28.11.196 || echo "overseas ping FAIL"
        API="https://cn.apihz.cn/api/wangzhan/ping.php?id=10012112&key=11a27dd28291dc973616eaad85dc6279"
        echo "--- apihz type=1 baseline (sydney control) ---"
        curl -sL "$API&host=207.148.81.3&type=1" | head -c 300; echo
        echo "--- apihz type=2 + port (sea node 30071) ---"
        curl -sL "$API&host=149.28.11.196&type=2&port=30071" | head -c 300; echo
        echo "--- apihz type=1 + port param ---"
        curl -sL "$API&host=149.28.11.196&type=1&port=30071" | head -c 300; echo
        echo "--- overseas ping 144.202.87.161 (deleted new ip, expect fail) skip ---"
