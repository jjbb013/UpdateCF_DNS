name: tmp-probe-syd
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe sydney node from overseas
        run: |
          for p in 22 1081 30071 30083; do timeout 6 bash -c "echo > /dev/tcp/45.32.247.95/$p" 2>/dev/null && echo "$p OPEN" || echo "$p FAIL"; done
          echo "=== traceroute-ish ==="
          timeout 15 traceroute -T -p 22 45.32.247.95 2>&1 | head -12 || true
          echo DONE
