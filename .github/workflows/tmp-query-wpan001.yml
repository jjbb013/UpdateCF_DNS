name: tmp-query-wpan001-ec2
on:
  workflow_dispatch:
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query wpan001 account instances
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_AP_SOUTH_1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_AP_SOUTH_1 }}
        run: |
          set -e
          echo "=== identity ==="
          aws sts get-caller-identity
          echo "=== instances per region ==="
          for r in $(aws ec2 describe-regions --query 'Regions[].RegionName' --output text); do
            out=$(aws ec2 describe-instances --region $r --filters Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].{id:InstanceId,type:InstanceType,ip:PublicIpAddress,state:State.Name,launch:LaunchTime,name:Tags[?Key==`Name`]|[0].Value}' --output json 2>/dev/null)
            cnt=$(echo "$out" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d))")
            if [ "$cnt" != "0" ]; then echo "--- $r ($cnt) ---"; echo "$out" | python3 -m json.tool; fi
          done
          echo "=== lightsail ==="
          for r in us-east-1 us-east-2 us-west-1 us-west-2 ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 eu-west-1 eu-west-2 eu-central-1 ca-central-1; do
            out=$(aws lightsail get-instances --region $r --query 'instances[].{name:name,state:state.name,ip:publicIpAddress,blueprintId:blueprintId}' --output json 2>/dev/null)
            cnt=$(echo "$out" | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d))" 2>/dev/null || echo 0)
            if [ "$cnt" != "0" ]; then echo "--- $r ---"; echo "$out"; fi
          done
          echo "=== DONE ==="
