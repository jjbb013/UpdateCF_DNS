name: Vultr Final Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Destroy candidate2 + verify final state
        run: |
          AUTH="Authorization: Bearer ${{ secrets.VULTR_API_KEY }}"
          CHK=$(curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r '.instances[] | select(.id=="7cf888bd-cce4-4093-bfd9-050db910b476") | .main_ip')
          if [ "$CHK" == "149.28.11.196" ]; then
            curl -s -o /dev/null -w "DELETE candidate2 (149.28.11.196) -> HTTP %{http_code}\n" -X DELETE \
              "https://api.vultr.com/v2/instances/7cf888bd-cce4-4093-bfd9-050db910b476" -H "$AUTH"
          else
            echo "SAFETY: candidate2 mismatch ($CHK), skip"
          fi
          for sid in $(curl -s "https://api.vultr.com/v2/snapshots" -H "$AUTH" | jq -r '.snapshots[]?.id'); do
            curl -s -o /dev/null -w "DELETE leftover snapshot $sid -> HTTP %{http_code}\n" -X DELETE \
              "https://api.vultr.com/v2/snapshots/$sid" -H "$AUTH"
          done
          sleep 5
          echo "=== FINAL ==="
          curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'
          echo "=== ports on 66.42.74.77 ==="
          for p in 30071 30077 30083; do
            timeout 5 bash -c "echo > /dev/tcp/66.42.74.77/$p" 2>/dev/null && echo "$p OK" || echo "$p FAIL"
          done
