name: Vultr Cleanup Orphan

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Destroy unswitched new instance and its snapshot
        run: |
          AUTH="Authorization: Bearer ${{ secrets.VULTR_API_KEY }}"
          # 确认目标：03c7ddbf 持有 144.202.92.171（被墙回收IP，DNS未切换过去）
          BODY=$(curl -s "https://api.vultr.com/v2/instances" -H "$AUTH")
          echo "$BODY" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'
          TARGET=$(echo "$BODY" | jq -r '.instances[] | select(.id=="03c7ddbf-8211-4917-b343-8cacb928a492" and .main_ip=="144.202.92.171") | .id')
          if [ "$TARGET" == "03c7ddbf-8211-4917-b343-8cacb928a492" ]; then
            curl -s -o /dev/null -w "DELETE 03c7ddbf -> HTTP %{http_code}\n" -X DELETE \
              "https://api.vultr.com/v2/instances/03c7ddbf-8211-4917-b343-8cacb928a492" -H "$AUTH"
          else
            echo "SAFETY: target instance/IP mismatch, NOT destroying"
            exit 1
          fi
          curl -s -o /dev/null -w "DELETE snapshot 3ad80caa -> HTTP %{http_code}\n" -X DELETE \
            "https://api.vultr.com/v2/snapshots/3ad80caa-e45c-4141-936a-08522019e904" -H "$AUTH"
          sleep 5
          FINAL=$(curl -s "https://api.vultr.com/v2/instances" -H "$AUTH")
          N=$(echo "$FINAL" | jq -r '[.instances[] | select(.label=="13nodes" and .region=="sea")] | length')
          echo "13nodes/sea count=$N (expect 1)"
          [ "$N" == "1" ] && echo "CLEANUP PASS" || { echo "CLEANUP FAIL"; exit 1; }
