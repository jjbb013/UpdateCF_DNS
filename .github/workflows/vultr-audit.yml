name: Vultr Cleanup To Three

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Destroy confirmed-blocked candidates, keep 149.28 for user test
        run: |
          AUTH="Authorization: Bearer ${{ secrets.VULTR_API_KEY }}"
          del() {
            local id=$1 ip=$2
            CHK=$(curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r --arg id "$id" '.instances[] | select(.id==$id) | .main_ip')
            if [ "$CHK" == "$ip" ]; then
              curl -s -o /dev/null -w "DELETE $id ($ip) -> HTTP %{http_code}\n" -X DELETE "https://api.vultr.com/v2/instances/$id" -H "$AUTH"
            else
              echo "SAFETY: $id IP mismatch (got $CHK, expect $ip), skip"
            fi
          }
          echo "=== PRE ==="
          curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'
          # 92.171 和 87.161 均经 apihz 多上海节点确认被墙
          del 37cea218-3096-45cb-a769-601f8b2bb14f 144.202.92.171
          del df7b15c8-096e-409f-bc96-536631be4106 144.202.87.161
          sleep 5
          echo "=== POST ==="
          curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'
