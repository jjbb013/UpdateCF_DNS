name: Vultr Salvage v3

on:
  workflow_dispatch:

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - name: China-check 87.161 then salvage
        run: |
          AUTH="Authorization: Bearer ${{ secrets.VULTR_API_KEY }}"
          CFA="Authorization: Bearer ${{ secrets.CF_API_TOKEN }}"
          del_inst() { curl -s -o /dev/null -w "DELETE $1 -> HTTP %{http_code}\n" -X DELETE "https://api.vultr.com/v2/instances/$1" -H "$AUTH"; }
          del_snap() { curl -s -o /dev/null -w "DELETE snapshot $1 -> HTTP %{http_code}\n" -X DELETE "https://api.vultr.com/v2/snapshots/$1" -H "$AUTH"; }

          echo "=== PRE-STATE ==="
          BODY=$(curl -s "https://api.vultr.com/v2/instances" -H "$AUTH")
          echo "$BODY" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'

          R_ID=1abe0ddb-05d8-428c-94c9-401a7a1c24b0
          R_IP=144.202.87.161
          O_ID=27345bed-1411-4df8-ab4b-c6623feb97a5

          # 校验 R 存活且 IP 匹配（双重确认）
          R_CHK=$(echo "$BODY" | jq -r --arg id "$R_ID" '.instances[] | select(.id==$id) | .main_ip')
          if [ "$R_CHK" != "$R_IP" ]; then echo "SAFETY: R mismatch ($R_CHK), abort"; exit 1; fi
          O_CHK=$(echo "$BODY" | jq -r --arg id "$O_ID" '.instances[] | select(.id==$id) | .id')
          if [ "$O_CHK" != "$O_ID" ]; then echo "SAFETY: O missing, abort"; exit 1; fi

          # 先清占位实例（无论走向如何都不需要了）
          for pid in $(echo "$BODY" | jq -r '.instances[] | select(.label=="ip-parking") | .id'); do
            del_inst $pid
          done

          # 中国可达检查（修正后的 URL 提取：BRE 无 *? 惰性语法）
          PREFIX=$(curl -s "https://raw.githubusercontent.com/jjbb013/UpdateCF_DNS/main/.github/workflows/Vultr_SEA01_Worker.yml" | grep -o 'https://cn\.apihz\.cn/api/wangzhan/ping\.php[^"]*host=' | head -1)
          echo "prefix=$PREFIX"
          resp=$(curl -sL "${PREFIX}host=$R_IP&type=1")
          echo "China ping $R_IP -> $resp"

          if [[ $resp == *"\"code\": 200"* ]]; then
            echo "== IP 国内可达，直接切换 DNS =="
            DNS_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records?name=kkk.onemorething.pp.ua" -H "$CFA" | jq -r '.result[0].id')
            PROXIED=$(curl -s "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records/$DNS_ID" -H "$CFA" | jq -r '.result.proxied')
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/dns_records/$DNS_ID" \
              -H "$CFA" -H "Content-Type: application/json" \
              --data-raw "{\"type\":\"A\",\"name\":\"kkk.onemorething.pp.ua\",\"content\":\"$R_IP\",\"proxied\":$PROXIED}" \
              -o /dev/null -w "DNS update -> HTTP %{http_code}\n"
            sleep 10
            dig +short @1.1.1.1 kkk.onemorething.pp.ua A || true
            del_inst $O_ID
          else
            echo "== IP 国内不通，销毁 R，回头重跑 =="
            del_inst $R_ID
          fi
          for sid in $(curl -s "https://api.vultr.com/v2/snapshots" -H "$AUTH" | jq -r '.snapshots[]?.id'); do del_snap $sid; done
          echo "=== POST-STATE ==="
          curl -s "https://api.vultr.com/v2/instances" -H "$AUTH" | jq -r '.instances[] | "\(.id) | \(.label) | \(.main_ip)"'
