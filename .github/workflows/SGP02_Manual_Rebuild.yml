name: SGP02_Manual_Rebuild
on:
  workflow_dispatch:
env:
  REGION: sgp
  PLAN: vhf-1c-1gb
  OS_ID: "2284"
  LABEL: aws-india01
  OLD_INSTANCE_ID: e938a81b-3fca-4bdd-bd12-8dee6bc30db3
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
    - name: Rename old instance (avoid label conflict)
      run: |
        RESP=$(curl -s -X PATCH "https://api.vultr.com/v2/instances/${{ env.OLD_INSTANCE_ID }}" \
          -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
          --data-raw '{"label":"aws-india01-old","hostname":"aws-india01-old"}')
        echo "$RESP" | jq -r '.instance.label // .error'
    - name: Create new SGP instance (fresh OS, NOT snapshot)
      id: create
      run: |
        RESP=$(curl -s -X POST "https://api.vultr.com/v2/instances" \
          -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
          --data-raw '{"region":"${{ env.REGION }}","plan":"${{ env.PLAN }}","os_id":${{ env.OS_ID }},"label":"${{ env.LABEL }}","hostname":"${{ env.LABEL }}"}')
        echo "$RESP" | jq -r '.instance.id' > /tmp/new_id
        echo "$RESP" | jq -r '.instance.default_password' > /tmp/new_pwd
        echo "id=$(cat /tmp/new_id)" >> $GITHUB_OUTPUT
        echo "region=$(echo "$RESP" | jq -r '.instance.region')" >> $GITHUB_OUTPUT
        echo "create resp:"; echo "$RESP" | jq -r '.instance | {id, status, region, main_ip}'
        if [ "$(cat /tmp/new_id)" == "null" ] || [ -z "$(cat /tmp/new_id)" ]; then echo "$RESP"; exit 1; fi
    - name: Wait for IP + verify region
      run: |
        NEW_IP="0.0.0.0"; REGION=""
        for i in $(seq 1 40); do
          INST=$(curl -s "https://api.vultr.com/v2/instances/$(cat /tmp/new_id)" -H "Authorization: Bearer $VULTR_API_KEY")
          NEW_IP=$(echo "$INST" | jq -r '.instance.main_ip')
          REGION=$(echo "$INST" | jq -r '.instance.region')
          echo "poll $i: ip=$NEW_IP region=$REGION"
          if [ "$NEW_IP" != "0.0.0.0" ] && [ "$NEW_IP" != "null" ] && [ -n "$NEW_IP" ]; then break; fi
          sleep 10
        done
        [ "$REGION" == "${{ env.REGION }}" ] || { echo "REGION MISMATCH: $REGION"; exit 1; }
        echo "NEW_IP=$NEW_IP" >> $GITHUB_ENV
        echo "FINAL_REGION=$REGION" >> $GITHUB_ENV
    - name: Emit credentials
      run: |
        echo "NEW_INSTANCE_ID=$(cat /tmp/new_id)"
        echo "::add-mask::$(cat /tmp/new_pwd)"
        echo "ROOT_PASSWORD<<EOF" >> $GITHUB_OUTPUT
        cat /tmp/new_pwd >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      id: creds
    - name: Summary
      run: |
        echo "新实例: $(cat /tmp/new_id) @ $NEW_IP ($FINAL_REGION)"
        echo "root 密码见步骤 'Emit credentials' 输出（已 mask）"
