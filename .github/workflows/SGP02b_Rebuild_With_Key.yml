name: SGP02b_Rebuild_With_Key
on:
  workflow_dispatch:
env:
  REGION: sgp
  PLAN: vhf-1c-1gb
  OS_ID: "2284"
  LABEL: aws-india01
  BAD_INSTANCE_ID: 65708d80-ba61-4569-aa34-36a52e02bc12
  PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC7r3pehmXN1eSOglRNaB08XVdExcdGZ8BznW32ahlDv will@Wills-MacBook-Air.local"
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
    - name: Register temp SSH key
      run: |
        RESP=$(curl -s -X POST "https://api.vultr.com/v2/ssh-keys" \
          -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
          --data-raw "{\"name\":\"sgp02-tmp\",\"ssh_key\":\"${{ env.PUBKEY }}\"}")
        echo "$RESP" | jq -r '.ssh_key.id' > /tmp/key_id
        echo "key_id=$(cat /tmp/key_id)"
        [ "$(cat /tmp/key_id)" == "null" ] && exit 1
    - name: Destroy no-password instance
      run: |
        curl -s -X DELETE "https://api.vultr.com/v2/instances/${{ env.BAD_INSTANCE_ID }}" \
          -H "Authorization: Bearer $VULTR_API_KEY" -o /dev/null -w "destroy: %{http_code}\n"
        sleep 10
    - name: Recreate with SSH key
      run: |
        RESP=$(curl -s -X POST "https://api.vultr.com/v2/instances" \
          -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
          --data-raw '{"region":"${{ env.REGION }}","plan":"${{ env.PLAN }}","os_id":${{ env.OS_ID }},"label":"${{ env.LABEL }}","hostname":"${{ env.LABEL }}","sshkey_id":"'$(cat /tmp/key_id)'"}')
        echo "$RESP" | jq -r '.instance.id' > /tmp/new_id
        echo "create:"; echo "$RESP" | jq -r '.instance | {id, status, region}'
        [ "$(cat /tmp/new_id)" == "null" ] && { echo "$RESP"; exit 1; }
    - name: Wait for IP + verify region
      run: |
        NEW_IP="0.0.0.0"; REGION=""
        for i in $(seq 1 40); do
          INST=$(curl -s "https://api.vultr.com/v2/instances/$(cat /tmp/new_id)" -H "Authorization: Bearer $VULTR_API_KEY")
          NEW_IP=$(echo "$INST" | jq -r '.instance.main_ip')
          REGION=$(echo "$INST" | jq -r '.instance.region')
          echo "poll $i: ip=$NEW_IP region=$REGION"
          if [ "$NEW_IP" != "0.0.0.0" ] && [ "$NEW_IP" != "null" ] && [ -n "$NEW_IP" ]; then break; fi
          sleep 10
        done
        [ "$REGION" == "${{ env.REGION }}" ] || { echo "REGION MISMATCH"; exit 1; }
        echo "RESULT: id=$(cat /tmp/new_id) ip=$NEW_IP region=$REGION"
    - name: Delete temp SSH key from Vultr account
      if: always()
      run: |
        curl -s -X DELETE "https://api.vultr.com/v2/ssh-keys/$(cat /tmp/key_id)" \
          -H "Authorization: Bearer $VULTR_API_KEY" -o /dev/null -w "key delete: %{http_code}\n" || true
