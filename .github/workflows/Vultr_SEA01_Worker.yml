name: Vultr_SEA01_Worker
on:
  schedule:
    - cron: '30 */3 * * *' # 每3小时执行一次（与AWS workflow错峰）
  workflow_dispatch:

env:
  INSTANCE_ID: 27345bed-1411-4df8-ab4b-c6623feb97a5
  REGION: sea
  PLAN: vhf-1c-1gb
  LABEL: '13nodes'
  DOMAIN: 'kkk.onemorething.pp.ua' # 需要查询的DNS名称
  CF_ZONE_ID: 1fa9774064820f53fe1733e37a19f721
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }} # 从GitHub Secrets中获取API Token
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }} # 从GitHub Secrets中获取Vultr API Key（注意：该Key不能开IP白名单，GitHub runner的IP不固定）
  PROXIED: 'false' # 是否开启Cloudflare代理，默认否
  VERIFY_PORTS: '30071 30072 30073 30074 30075 30076 30077 30078 30079 30080 30081 30082 30083' # 重建后从runner(境外)探测的业务端口

jobs:
  healthcheck_and_manage_vultr:
    runs-on: ubuntu-latest
    steps:
    - name: Check Connectivity
      id: ping_check
      run: |
        API_URL="https://cn.apihz.cn/api/wangzhan/ping.php?id=10012112&key=11a27dd28291dc973616eaad85dc6279&host=${{env.DOMAIN}}&type=1"
        response=$(curl -sL "$API_URL")
        echo "${{ env.DOMAIN }} $response"
        if [[ $response == *"\"code\": 200"* ]]; then
          echo "Domain is pingable at $(date)"
          echo "::set-output name=pingable::true"
        else
          echo "Domain is NOT pingable at $(date)"
          echo "::set-output name=pingable::false"
        fi

    - name: Rebuild Vultr Instance from Snapshot
      if: steps.ping_check.outputs.pingable == 'false'
      id: rebuild
      run: |
        # Vultr主IP无法原地更换，域名不通时通过快照重建拿新随机IP（配置/ufw/XrayR随快照保留，无需重做配置）
        echo "Creating snapshot of instance ${{ env.INSTANCE_ID }} ..."
        SNAP_RESP=$(curl -s -X POST "https://api.vultr.com/v2/snapshots" \
          -H "Authorization: Bearer $VULTR_API_KEY" \
          -H "Content-Type: application/json" \
          --data-raw '{"instance_id":"${{ env.INSTANCE_ID }}","description":"gh-actions-swap-ip"}')
        echo "$SNAP_RESP"
        SNAP_ID=$(echo "$SNAP_RESP" | jq -r '.snapshot.id')
        if [ -z "$SNAP_ID" ] || [ "$SNAP_ID" == "null" ]; then
          echo "Failed to create snapshot"
          exit 1
        fi

        # 轮询等待快照完成（约5-15分钟）
        echo "Waiting for snapshot $SNAP_ID to complete..."
        SNAP_STATUS="pending"
        for i in $(seq 1 60); do
          SNAP_STATUS=$(curl -s "https://api.vultr.com/v2/snapshots/$SNAP_ID" \
            -H "Authorization: Bearer $VULTR_API_KEY" | jq -r '.snapshot.status')
          echo "Snapshot status: $SNAP_STATUS ($(date))"
          [ "$SNAP_STATUS" == "complete" ] && break
          sleep 20
        done
        if [ "$SNAP_STATUS" != "complete" ]; then
          echo "Snapshot did not complete in time"
          exit 1
        fi

        # 从快照建新实例（限同区域），新实例分到新随机IP，root密码被重置但本流程不需要SSH
        echo "Creating new instance from snapshot $SNAP_ID ..."
        NEW_RESP=$(curl -s -X POST "https://api.vultr.com/v2/instances" \
          -H "Authorization: Bearer $VULTR_API_KEY" \
          -H "Content-Type: application/json" \
          --data-raw '{"region":"${{ env.REGION }}","plan":"${{ env.PLAN }}","snapshot_id":"'$SNAP_ID'","label":"${{ env.LABEL }}"}')
        NEW_INSTANCE_ID=$(echo "$NEW_RESP" | jq -r '.instance.id')
        if [ -z "$NEW_INSTANCE_ID" ] || [ "$NEW_INSTANCE_ID" == "null" ]; then
          echo "Failed to create instance from snapshot"
          echo "$NEW_RESP"
          exit 1
        fi
        echo "New instance ID: $NEW_INSTANCE_ID"

        # 轮询等待新实例就绪并分配到IP（约3-5分钟）
        echo "Waiting for new instance to become ready..."
        NEW_IP="0.0.0.0"
        for i in $(seq 1 60); do
          INST=$(curl -s "https://api.vultr.com/v2/instances/$NEW_INSTANCE_ID" \
            -H "Authorization: Bearer $VULTR_API_KEY")
          NEW_IP=$(echo "$INST" | jq -r '.instance.main_ip')
          SERVER_STATUS=$(echo "$INST" | jq -r '.instance.server_status')
          echo "main_ip=$NEW_IP server_status=$SERVER_STATUS ($(date))"
          if [ "$NEW_IP" != "0.0.0.0" ] && [ "$NEW_IP" != "null" ] && [ -n "$NEW_IP" ] && [ "$SERVER_STATUS" == "ok" ]; then
            break
          fi
          sleep 15
        done
        if [ "$NEW_IP" == "0.0.0.0" ] || [ -z "$NEW_IP" ] || [ "$NEW_IP" == "null" ]; then
          echo "New instance did not get a valid IP in time"
          exit 1
        fi

        echo "New Public IP: $NEW_IP"
        echo "NEW_IP=$NEW_IP" >> $GITHUB_ENV
        echo "SNAP_ID=$SNAP_ID" >> $GITHUB_ENV
        echo "NEW_INSTANCE_ID=$NEW_INSTANCE_ID" >> $GITHUB_ENV

    - name: Verify Ports from Runner
      if: steps.ping_check.outputs.pingable == 'false' && steps.rebuild.outcome == 'success'
      id: verify_ports
      run: |
        # GitHub runner在境外，可直接作为探测点；业务端口全部连通即证明XrayR已恢复，无需SSH登录
        for port in ${{ env.VERIFY_PORTS }}; do
          if timeout 8 bash -c "echo > /dev/tcp/$NEW_IP/$port" 2>/dev/null; then
            echo "Port $port is reachable on $NEW_IP"
          else
            echo "Port $port is NOT reachable on $NEW_IP"
            exit 1
          fi
        done

    - name: Get Cloudflare DNS Record ID
      if: steps.ping_check.outputs.pingable == 'false' && steps.verify_ports.outcome == 'success'
      run: |
        # 使用cURL调用Cloudflare API获取DNS记录ID
        DNS_RECORDS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${{ env.CF_ZONE_ID }}/dns_records?name=${{ env.DOMAIN }}" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json")
        DNS_ID=$(echo "${DNS_RECORDS}" | jq -r '.result[] | select(.name == "'${{ env.DOMAIN }}'") | .id')
        if [ -z "$DNS_ID" ]; then
          echo "No DNS record found for ${{ env.DOMAIN }}"
          exit 1
        else
          echo "DNS Record ID for ${{ env.DOMAIN }}: $DNS_ID"
          echo "DNS_ID=$DNS_ID" >> $GITHUB_ENV
        fi

    - name: Update DNS Record
      if: steps.ping_check.outputs.pingable == 'false' && steps.verify_ports.outcome == 'success'
      id: update_dns
      run: |
        # 构建cURL请求命令，使用先前获取到的DNS_ID
        UPDATE_CMD=$(echo -n "{\"type\":\"A\",\"name\":\"${{ env.DOMAIN }}\",\"content\":\"$NEW_IP\",\"proxied\":${{ env.PROXIED }}}")
        curl -X PUT "https://api.cloudflare.com/client/v4/zones/${{ env.CF_ZONE_ID }}/dns_records/${{ env.DNS_ID }}" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data-raw "$UPDATE_CMD"

        # 检查响应状态
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.cloudflare.com/client/v4/zones/${{ env.CF_ZONE_ID }}/dns_records/${{ env.DNS_ID }}" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json")

        if [ "$RESPONSE" -eq 200 ]; then
          echo "DNS record updated successfully."
        else
          echo "Failed to update DNS record. Response code: $RESPONSE"
          exit 1
        fi

    - name: Destroy Old Instance and Snapshot
      if: steps.ping_check.outputs.pingable == 'false' && steps.update_dns.outcome == 'success'
      run: |
        # DNS切换成功后再清理旧实例和快照，避免新实例未就绪就销毁旧实例（销毁后旧IP不可找回）
        echo "Destroying old instance ${{ env.INSTANCE_ID }} ..."
        curl -s -o /dev/null -w "DELETE old instance -> HTTP %{http_code}\n" -X DELETE \
          "https://api.vultr.com/v2/instances/${{ env.INSTANCE_ID }}" \
          -H "Authorization: Bearer $VULTR_API_KEY"
        echo "Deleting snapshot $SNAP_ID ..."
        curl -s -o /dev/null -w "DELETE snapshot -> HTTP %{http_code}\n" -X DELETE \
          "https://api.vultr.com/v2/snapshots/$SNAP_ID" \
          -H "Authorization: Bearer $VULTR_API_KEY"
        echo "Important: 重建后 INSTANCE_ID 已变更为 $NEW_INSTANCE_ID，请更新本workflow的env.INSTANCE_ID后再依赖下次自动恢复！"
