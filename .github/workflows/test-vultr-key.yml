name: Test Vultr API Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set label on Sydney instance + verify resolve logic
        run: |
          # 1) 给悉尼实例打 label（SYD01 workflow 按 label=syd-node40+region=syd 解析，实际 label 为空会匹配失败）
          PATCH=$(curl -s -w '__HTTP__%{http_code}' -X PATCH \
            "https://api.vultr.com/v2/instances/88b764c4-9786-4f27-9f90-19077bcdf4b1" \
            -H "Authorization: Bearer ${{ secrets.VULTR_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"label":"syd-node40"}')
          echo "PATCH HTTP: $(echo "$PATCH" | grep -o '__HTTP__[0-9]*')"
          # 2) 重新拉取实例列表，验证两个 worker 的解析条件都能唯一命中
          BODY=$(curl -s "https://api.vultr.com/v2/instances" \
            -H "Authorization: Bearer ${{ secrets.VULTR_API_KEY }}")
          echo "--- All instances (label | region | id | ip):"
          echo "$BODY" | jq -r '.instances[] | "\(.label) | \(.region) | \(.id) | \(.main_ip)"'
          SEA=$(echo "$BODY" | jq -r '.instances[]? | select(.label=="13nodes" and .region=="sea") | .id')
          SYD=$(echo "$BODY" | jq -r '.instances[]? | select(.label=="syd-node40" and .region=="syd") | .id')
          echo "SEA01 resolve: $SEA"
          echo "SYD01 resolve: $SYD"
          if [ -n "$SEA" ] && [ -n "$SYD" ]; then
            echo "PASS: both workers can resolve their instance"
          else
            echo "FAIL: resolve mismatch"
            exit 1
          fi
