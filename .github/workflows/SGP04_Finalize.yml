name: SGP04_Finalize
on:
  workflow_dispatch:
env:
  VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
  OLD_ID: b8752386-4352-4791-8461-08d2172a05ce
  NEW_ID: 786f3d7e-8b88-4c29-9563-11a9240d079c
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
    - name: Destroy old instance
      run: |
        curl -s -X DELETE "https://api.vultr.com/v2/instances/$OLD_ID" -H "Authorization: Bearer $VULTR_API_KEY" -o /dev/null -w "destroy old: %{http_code}\n"
        sleep 8
    - name: Rename new instance to aws-india01
      run: |
        curl -s -X PATCH "https://api.vultr.com/v2/instances/$NEW_ID" \
          -H "Authorization: Bearer $VULTR_API_KEY" -H "Content-Type: application/json" \
          -d '{"label":"aws-india01"}' | jq -r '.instance | "renamed: \(.label) \(.main_ip) \(.region)"'
    - name: Verify instance list
      run: |
        curl -s "https://api.vultr.com/v2/instances" -H "Authorization: Bearer $VULTR_API_KEY" \
          | jq -r '.instances[] | select(.label | test("aws-india01|13nodes|syd-node40")) | "\(.id[0:8]) \(.label) \(.region) \(.main_ip)"'
    - name: Delete temp workflow files
      run: |
        for f in SGP03_NewIP.yml SGP04_Finalize.yml; do
          SHA=$(gh api "repos/${{ github.repository }}/contents/.github/workflows/$f" --jq '.sha' 2>/dev/null || echo "")
          if [ -n "$SHA" ]; then
            gh api "repos/${{ github.repository }}/contents/.github/workflows/$f" -X DELETE \
              -f message="cleanup: $f" -f sha="$SHA" && echo "deleted: $f"
          fi
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
