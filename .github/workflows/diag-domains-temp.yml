name: Diagnose 2 Domains (temp)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
    - name: DNS records
      run: |
        for D in aws.ap-south1.onemorething.pp.ua kkk.onemorething.pp.ua; do
          echo "--- $D ---"
          dig +short $D @1.1.1.1
          dig +short $D @8.8.8.8
        done
    - name: CF records
      run: |
        for D in aws.ap-south1.onemorething.pp.ua kkk.onemorething.pp.ua; do
          echo "--- CF $D ---"
          curl -s -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" "https://api.cloudflare.com/client/v4/zones/1fa9774064820f53fe1733e37a19f721/dns_records?type=A&name=$D" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r['content'],'proxied=',r['proxied'],'modified=',r['modified_on']) for r in d.get('result',[])]"
        done
    - name: TCP service check from runner
      run: |
        echo "--- kkk ports (30071-30083 sample) ---"
        for p in 30071 30077 30083; do
          if timeout 5 bash -c "echo > /dev/tcp/kkk.onemorething.pp.ua/$p" 2>/dev/null; then echo "kkk:$p OPEN"; else echo "kkk:$p FAIL"; fi
        done
        echo "--- aws.ap-south1 ports (1081, 443, 22) ---"
        for p in 1081 443 22; do
          if timeout 5 bash -c "echo > /dev/tcp/aws.ap-south1.onemorething.pp.ua/$p" 2>/dev/null; then echo "ap-south1:$p OPEN"; else echo "ap-south1:$p FAIL"; fi
        done
    - name: Vultr instances
      run: |
        curl -s -H "Authorization: Bearer ${{ secrets.VULTR_API_KEY }}" "https://api.vultr.com/v2/instances" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(i['id'],i['label'],i['region'],i['main_ip'],i['status'],i['power_status']) for i in d.get('instances',[])]"
    - name: Vultr pending charges
      run: |
        curl -s -H "Authorization: Bearer ${{ secrets.VULTR_API_KEY }}" "https://api.vultr.com/v2/billing/pending-charges" | head -c 400; echo
